name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
    env:
      PYTHONPATH: /opt/hermes
      HERMES_HOME: /tmp/hermes-dex-auth-plugin-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
      - name: Install the plugin and development dependencies
        run: uv sync --locked
      - name: Test against the target Hermes runtime
        run: uv run --locked python -m unittest discover -s tests -v
