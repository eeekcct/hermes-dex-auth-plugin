[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-dex-auth-plugin"
version = "0.1.0"
description = "Dex authentication and login access policy for Hermes Dashboard"
readme = "README.md"
requires-python = ">=3.14.9,<3.15"
dependencies = [
    "httpx==0.28.1",
    "PyJWT[crypto]==2.15.1",
]

[project.entry-points."hermes_agent.plugins"]
dex-auth = "hermes_dex_auth_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_dex_auth_plugin"]

[tool.hatch.build.targets.wheel.force-include]
"plugin.yaml" = "hermes_dex_auth_plugin/plugin.yaml"

[dependency-groups]
dev = [
    "ruff>=0.15,<0.16",
    # Hermes source imports used by configuration and plugin-discovery tests.
    "ruamel.yaml==0.18.16",
    "python-dotenv==1.2.4",
    "rich==14.3.4",
    "packaging==26.3",
    "pyright>=1.1.414",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN"]

[tool.pyright]
include = ["__init__.py", "src", "tests"]
typeCheckingMode = "strict"
# Provider hooks and tests intentionally access Hermes internals.
reportPrivateUsage = false
# Keep runtime validation for values supplied by untyped callers.
reportUnnecessaryIsInstance = false
extraPaths = ["src", "../hermes-agent"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
useLibraryCodeForTypes = true
